<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-raised);padding:24px;font-family:var(--font-mono);display:flex;flex-direction:column;align-items:center;gap:14px}.wrap{width:280px}.note{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);text-align:center}</style>
</head>
<body>
<div class="wrap"><div id="root"></div></div>
<p class="note">280×350 · aspect-ratio 1080/1350 (IG 4:5)</p>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { MobileCarousel, Eyebrow } = window.NFCDDesignSystem_1d3b67;
  const slideStyle = (bg) => ({height:"100%",display:"flex",flexDirection:"column",justifyContent:"center",gap:8,padding:"0 34px",background:bg,color:"var(--text-on-ink)",boxSizing:"border-box"});
  function Slide({ n, bg, title, body }) {
    return (
      <div style={slideStyle(bg)}>
        <div style={{fontFamily:"var(--font-mono)",fontSize:16,opacity:.7}}>{n}</div>
        <div style={{fontFamily:"var(--font-display)",fontSize:28,lineHeight:1.05}}>{title}</div>
        <div style={{fontFamily:"var(--font-serif)",fontSize:18,lineHeight:1.4,opacity:.92}}>{body}</div>
        <Eyebrow style={{color:"var(--text-on-ink)",opacity:.75,fontSize:14}}>Encuentro · Otoño 2026</Eyebrow>
      </div>
    );
  }
  function Demo() {
    return (
      <MobileCarousel>
        <Slide n="01" bg="var(--chip-wine-solid)" title="El cuerpo que escucha" body="Tres encuentros en Campo Arroyo del Medio." />
        <Slide n="02" bg="var(--surface-ink)" title="La médula participante" body="Prácticas somáticas al aire libre." />
        <Slide n="03" bg="var(--chip-sage-solid)" title="Naturaleza de la fuerza" body="Cuerpo, danza y territorio." />
      </MobileCarousel>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
