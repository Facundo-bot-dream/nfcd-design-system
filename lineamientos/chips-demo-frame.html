<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  body {
    background: var(--surface-page);
    padding: 28px;
    font-family: var(--font-mono);
    transition: background .2s;
  }
  .grid {
    display: grid;
    grid-template-columns: 64px 1fr 1fr;
    align-items: center;
    gap: 16px 20px;
  }
  .rowlabel {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .colhead {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .cell { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script type="text/babel">
  // Tema desde la URL: ?theme=dark
  const theme = new URLSearchParams(location.search).get("theme");
  if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");

  const { Badge } = window.NFCDDesignSystem_1d3b67;
  const tones = ["wine", "ink", "sage"];

  function Demo() {
    return (
      <div className="grid">
        <div></div>
        <div className="colhead">soft</div>
        <div className="colhead">solid</div>
        {tones.map((t) => (
          <React.Fragment key={t}>
            <div className="rowlabel">{t}</div>
            <div className="cell">
              <Badge tone={t} variant="soft">Encuentro</Badge>
            </div>
            <div className="cell">
              <Badge tone={t} variant="solid">Encuentro</Badge>
            </div>
          </React.Fragment>
        ))}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
