<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFCD — Naturaleza de la Fuerza</title>
<script>
  /* Tema: elección guardada > preferencia del SO. Inline y antes del CSS para evitar FOUC. */
  (function () {
    var t = localStorage.getItem("nfcd-theme");
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface-page); color: var(--text-body); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="SiteHeader.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="EncuentrosGrid.jsx"></script>
<script type="text/babel" src="AboutBlock.jsx"></script>
<script type="text/babel" src="SiteFooter.jsx"></script>
<script type="text/babel">
  function Site() {
    return (
      <React.Fragment>
        <SiteHeader />
        <Hero />
        <EncuentrosGrid />
        <AboutBlock />
        <SiteFooter />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Site />);
</script>
<script>
  /* Toggle demo claro/oscuro — afordancia de preview, no forma parte de los componentes. */
  (function () {
    var b = document.createElement("button");
    b.textContent = "☾ / ☀";
    b.setAttribute("aria-label", "Cambiar tema");
    b.style.cssText = "position:fixed;bottom:18px;right:18px;z-index:99;padding:8px 12px;font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;background:var(--surface-card);color:var(--text-body);border:1px solid var(--border-strong);border-radius:var(--radius-sm);cursor:pointer;box-shadow:var(--shadow-md);";
    b.onclick = function () {
      var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      localStorage.setItem("nfcd-theme", next);
    };
    document.body.appendChild(b);
  })();
</script>
</body>
</html>
