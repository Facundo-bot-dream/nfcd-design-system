<!-- @dsCard group="Guidelines" viewport="900x760" name="Patrones móviles y de interacción" subtitle="Referencia visual — reglas y detalle técnico en PATTERNS.md." -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--paper-000);padding:36px 40px;font-family:var(--font-serif);color:var(--text-body)}
h1{font-family:var(--font-display);font-size:36px;color:var(--text-strong);margin:0 0 4px}
.lead{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tile{border:1px solid var(--border-hair);border-radius:var(--radius-sm);padding:16px;background:var(--surface-card)}
.tile h2{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin:0 0 12px}
.tile .demo{display:flex;align-items:center;justify-content:center;height:120px}
</style>
</head>
<body>
<h1>Patrones móviles</h1>
<p class="lead">Reglas y código en PATTERNS.md — esta ficha es solo referencia visual</p>
<div class="grid" id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<script type="text/babel">
const { MobileCarousel, Accordion, Eyebrow } = window.NFCDDesignSystem_1d3b67;
function Tile({ title, children }) {
  return <div className="tile"><h2>{title}</h2><div className="demo">{children}</div></div>;
}
function CarouselTile() {
  const slideStyle = { height: "100%", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--ink-800)", color: "var(--paper-000)", fontFamily: "var(--font-mono)", fontSize: 14 };
  return (
    <div style={{ width: 120 }}>
      <MobileCarousel aspectRatio="4/5" style={{ borderRadius: "var(--radius-sm)" }}>
        <div style={slideStyle}>01</div>
        <div style={slideStyle}>02</div>
        <div style={slideStyle}>03</div>
      </MobileCarousel>
    </div>
  );
}
function AccordionTile() {
  return <div style={{ width: "100%" }}><Accordion label="Ver detalles" defaultOpen><p style={{ fontSize: 13, margin: 0 }}>Contenido colapsable con altura medida.</p></Accordion></div>;
}
function FloatingCTATile() {
  return (
    <button style={{ background: "color-mix(in oklab, var(--surface-ink) 70%, transparent)", backdropFilter: "blur(8px)", color: "var(--paper-000)", border: "none", borderRadius: "999px", padding: "10px 20px", fontFamily: "var(--font-mono)", fontSize: 12, letterSpacing: ".06em", textTransform: "uppercase", animation: "nfcd-fab-pulse 2.4s ease-in-out infinite" }}>Conocer más</button>
  );
}
function Demo() {
  return (
    <React.Fragment>
      <Tile title="Carrusel IG"><CarouselTile /></Tile>
      <Tile title="Acordeón"><AccordionTile /></Tile>
      <Tile title="Botón flotante"><FloatingCTATile /></Tile>
    </React.Fragment>
  );
}
const style = document.createElement("style");
style.textContent = "@keyframes nfcd-fab-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}";
document.head.appendChild(style);
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
