<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;width:1280px;height:854px}
  body{display:flex;font-family:var(--font-serif)}
  .main{flex:1;background:var(--brand);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .main img{width:62%;max-height:60%;object-fit:contain}
  .strip{width:96px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style>
</head>
<body>
<div class="main"><img src="recursos/logos/nfcd_logo_alpha_light.png" alt=""></div>
<div class="strip">
  <div style="background:var(--sage-300)"></div>
  <div style="background:var(--sage-500)"></div>
  <div style="background:var(--wine-600)"></div>
  <div style="background:var(--wine-900)"></div>
</div>
</body>
</html>
